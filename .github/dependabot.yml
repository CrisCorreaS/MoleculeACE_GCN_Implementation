version: 2
updates:
  # Historical training dependencies are pinned experimental evidence.
  # Do not upgrade that environment automatically; maintain only CPU analysis here.
  - package-ecosystem: pip
    directory: /environments/analysis
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

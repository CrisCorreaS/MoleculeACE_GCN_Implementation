name: CPU analysis checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up analysis Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: environments/analysis/requirements.txt
      - name: Install analysis dependencies
        run: python -m pip install -r environments/analysis/requirements.txt
      - name: Install pinned lint tooling
        run: python -m pip install ruff==0.15.7
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check historical sources and explicit post-training corrections
        run: python -B tools/check_documentation_only.py --revision-manifest tools/current_source_revision.json
      - name: Run the selected scientific CPU tests
        # The explicit runner reports unavailable chemistry/GPU checks as skips.
        # Synthetic fixtures do not train models or change the saved campaign.
        run: python -B tools/run_scientific_tests.py
      - name: Test source-verification tooling
        run: python -B -m unittest discover -s tools -p test_source_verification.py -v
      - name: Test archive-building tooling
        run: python -B -m unittest discover -s code/tests -p test_build_archive.py -v
      - name: Lint maintained Python files
        # pyproject.toml excludes recorded training sources and the immutable snapshot.
        run: python -m ruff check .
      - name: Check formatting of maintained Python files
        run: python -m ruff format --check .
